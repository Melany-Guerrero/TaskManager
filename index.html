<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="TaskManager: aplicación de gestión de tareas con JavaScript.">

    <title>TaskManager | Gestión de tareas</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>TaskManager</h1>
        <p>Organiza tus tareas de manera sencilla.</p>
    </header>

    <main>
        <section id="dashboard">
            <h2>Mi panel de tareas</h2>
            <p>Total de tareas: <span id="total-tasks">0</span></p>
            <p>Pendientes: <span id="pending-tasks">0</span></p>
            <p>Completadas: <span id="completed-tasks">0</span></p>
        </section>

<section id="task-form-section">
    <h2 id="form-heading">Crear una tarea</h2>

    <form id="task-form" class="task-form">

        <div class="form-group">
            <label for="task-title">Título de la tarea *</label>
            <input
                type="text"
                id="task-title"
                name="title"
                maxlength="100"
                placeholder="Ej. Estudiar JavaScript"
                required
            >
        </div>

        <div class="form-group">
            <label for="task-description">Descripción</label>
            <textarea
                id="task-description"
                name="description"
                maxlength="500"
                placeholder="Describe brevemente la tarea"
            ></textarea>
        </div>

        <div class="form-group">
            <label for="task-priority">Prioridad</label>
            <select id="task-priority" name="priority">
                <option value="high">Alta</option>
                <option value="medium" selected>Media</option>
                <option value="low">Baja</option>
            </select>
        </div>

        <div class="task-actions">
            <button type="submit" id="submit-task" class="btn btn-primary">
                Agregar tarea
            </button>

            <button
                type="button"
                id="cancel-edit"
                class="btn btn-secondary"
                hidden
            >
                Cancelar edición
            </button>
        </div>

    </form>
</section>

<section id="task-list-section">

    <h2>Lista de tareas</h2>

    <div class="task-controls">

        <input
            type="search"
            id="search-tasks"
            class="search-input"
            placeholder="Buscar por título..."
            aria-label="Buscar tareas por título"
        >

        <select
            id="filter-status"
            class="filter-select"
            aria-label="Filtrar tareas por estado"
        >
            <option value="all">Todas las tareas</option>
            <option value="pending">Pendientes</option>
            <option value="completed">Completadas</option>
        </select>

        <select
            id="sort-tasks"
            class="sort-select"
            aria-label="Ordenar tareas"
        >
            <option value="newest">Más recientes</option>
            <option value="oldest">Más antiguas</option>
            <option value="high">Prioridad: Alta a Baja</option>
            <option value="low">Prioridad: Baja a Alta</option>
        </select>

    </div>

    <p id="empty-message">Todavía no hay tareas para mostrar.</p>

    <div id="task-list"></div>

</section>

        <div id="notification" role="status" aria-live="polite"></div>
    </main>

    <footer>
        <p>TaskManager - Proyecto académico de JavaScript Vanilla.</p>
    </footer>

</body>
</html>
